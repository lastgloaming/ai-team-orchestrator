name: Offline mock checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s tests -v
      - run: python -m pip install 'setuptools>=68'
      - run: bash scripts/check_v1_install.sh
  isolated-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORCHESTRATOR_LIVE_APPROVED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -B -m tests.p4_isolated prepare "$RUNNER_TEMP/p4/ledger.sqlite"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-p4-ledger
          path: ${{ runner.temp }}/p4/ledger.sqlite
          if-no-files-found: error
          retention-days: 1
          overwrite: true
  isolated-restore:
    needs: isolated-prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORCHESTRATOR_LIVE_APPROVED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: synthetic-p4-ledger
          path: ${{ runner.temp }}/p4
      - run: python -B -m tests.p4_isolated restore "$RUNNER_TEMP/p4/ledger.sqlite"
