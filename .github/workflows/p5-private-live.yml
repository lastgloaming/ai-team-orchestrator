name: P5 private one-shot scheduling
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      bootstrap_main:
        description: Reviewed main SHA for separately approved private bootstrap
        required: true
        type: string
permissions:
  contents: read
env:
  ORCHESTRATOR_P5_LEDGER_REPO: ${{ vars.ORCHESTRATOR_P5_LEDGER_REPO }}
  ORCHESTRATOR_P5_LEDGER_ID: ${{ vars.ORCHESTRATOR_P5_LEDGER_ID }}
  ORCHESTRATOR_P5_STATE_ANCHOR: ${{ vars.ORCHESTRATOR_P5_STATE_ANCHOR }}
  ORCHESTRATOR_P5_WITNESS_ANCHOR: ${{ vars.ORCHESTRATOR_P5_WITNESS_ANCHOR }}
  ORCHESTRATOR_P5_SCHEDULING_ENABLED: ${{ vars.ORCHESTRATOR_P5_SCHEDULING_ENABLED }}
  ORCHESTRATOR_P5_LIVE_APPROVED: ${{ vars.ORCHESTRATOR_P5_LIVE_APPROVED }}
jobs:
  bootstrap-private:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'lastgloaming/ai-team-orchestrator' &&
      github.ref == 'refs/heads/main' &&
      vars.ORCHESTRATOR_P5_BOOTSTRAP_APPROVED == '1' &&
      vars.ORCHESTRATOR_P5_SCHEDULING_ENABLED != '1' &&
      vars.ORCHESTRATOR_P5_LIVE_APPROVED != '1'
    environment: p5-private-live
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -B -m orchestrator.live_scheduling
        env:
          ORCHESTRATOR_P5_BOOTSTRAP_MAIN: ${{ inputs.bootstrap_main }}
          ORCHESTRATOR_P5_BOOTSTRAP_APPROVED: ${{ vars.ORCHESTRATOR_P5_BOOTSTRAP_APPROVED }}
          ORCHESTRATOR_P5_LEDGER_TOKEN: ${{ secrets.ORCHESTRATOR_P5_LEDGER_TOKEN }}
  private-advice:
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'lastgloaming/ai-team-orchestrator' &&
      github.ref == 'refs/heads/main' &&
      github.event.issue.pull_request != null &&
      github.event.sender.id == 338499555 &&
      github.event.comment.body == 'P5-SYNTHETIC-LIVE-ADVICE' &&
      format('{0}', github.event.issue.number) == vars.ORCHESTRATOR_P5_TEST_PR &&
      vars.ORCHESTRATOR_P5_SCHEDULING_ENABLED == '1' &&
      vars.ORCHESTRATOR_P5_LIVE_APPROVED == '1'
    environment: p5-private-live
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -B -m orchestrator.live_scheduling
        env:
          ORCHESTRATOR_P5_LEDGER_TOKEN: ${{ secrets.ORCHESTRATOR_P5_LEDGER_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          ORCHESTRATOR_P5_APPROVAL_ID: ${{ vars.ORCHESTRATOR_P5_APPROVAL_ID }}
          ORCHESTRATOR_P5_APPROVED_COMMENT: ${{ vars.ORCHESTRATOR_P5_APPROVED_COMMENT }}
          ORCHESTRATOR_P5_SOURCE_REPO_ID: ${{ vars.ORCHESTRATOR_P5_SOURCE_REPO_ID }}
          ORCHESTRATOR_P5_TEST_PR: ${{ vars.ORCHESTRATOR_P5_TEST_PR }}
          ORCHESTRATOR_P5_BUDGET_NANOYUAN: ${{ vars.ORCHESTRATOR_P5_BUDGET_NANOYUAN }}
          ORCHESTRATOR_P5_INPUT_BOUND: ${{ vars.ORCHESTRATOR_P5_INPUT_BOUND }}
          ORCHESTRATOR_MODEL_STOP: ${{ vars.ORCHESTRATOR_MODEL_STOP }}
          ORCHESTRATOR_STOP: ${{ vars.ORCHESTRATOR_STOP }}
