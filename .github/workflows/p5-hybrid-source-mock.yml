name: P5 hybrid native source Mock
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  source-read-mock:
    if: >-
      vars.ORCHESTRATOR_P5_HYBRID_MOCK_ENABLED == '1' &&
      github.repository == 'lastgloaming/ai-team-orchestrator' &&
      github.ref == 'refs/heads/main' &&
      github.event.issue.pull_request != null &&
      format('{0}', github.event.issue.number) == vars.ORCHESTRATOR_P5_HYBRID_MOCK_PR &&
      github.event.sender.id == 338499555 &&
      github.event.comment.body == 'P5-HYBRID-SOURCE-MOCK'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -B -m orchestrator.hybrid_source_mock
        env:
          ORCHESTRATOR_P5_HYBRID_MOCK_ENABLED: ${{ vars.ORCHESTRATOR_P5_HYBRID_MOCK_ENABLED }}
          ORCHESTRATOR_P5_HYBRID_MOCK_PR: ${{ vars.ORCHESTRATOR_P5_HYBRID_MOCK_PR }}
          GITHUB_TOKEN: ${{ github.token }}
      - run: python -B -m unittest discover -s tests -p test_hybrid_mock.py -v
